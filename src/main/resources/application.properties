#spring.application.name=pagopa-posgw-transactions-handler
application.name=${name}
build.version=${version}
# Logging
logging.level.root=\${ROOT_LOGGING_LEVEL:INFO}
logging.level.it.pagopa=\${APP_LOGGING_LEVEL:INFO}
logging.level.web=\${WEB_LOGGING_LEVEL:INFO}
spring.profiles.active=\${ACTIVE_PROFILE:local}

# Azure Service Bus
azure.servicebus.connection-string=\${SERVICE_BUS_CONNECTION_STRING}

azure.servicebus.queues.ecommerce.sync=\${ECOMMERCE_SYNC_QUEUE_NAME}
azure.servicebus.queues.ecommerce.sync-retry=\${ECOMMERCE_SYNC_RETRY_QUEUE_NAME}
azure.servicebus.queues.gec.sync=\${GEC_SYNC_QUEUE_NAME}
azure.servicebus.queues.gec.sync-retry=\${GEC_SYNC_RETRY_QUEUE_NAME}
azure.servicebus.queues.session.poll=\${SESSION_POLLING_QUEUE_NAME}
azure.servicebus.queues.session.expire=\${SESSION_EXPIRE_QUEUE_NAME}

azure.servicebus.topics.system.telemetry=\${SYSTEM_TELEMETRY_TOPIC_NAME}