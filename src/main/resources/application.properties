#spring.application.name=pagopa-posgw-transactions-handler
application.name=${name}
build.version=${version}
# Logging
logging.level.root=\${ROOT_LOGGING_LEVEL:INFO}
logging.level.it.pagopa=\${APP_LOGGING_LEVEL:INFO}
logging.level.web=\${WEB_LOGGING_LEVEL:INFO}
spring.profiles.active=\${ACTIVE_PROFILE:local}
spring.autoconfigure.exclude=com.azure.spring.cloud.autoconfigure.implementation.context.AzureTokenCredentialAutoConfiguration
# Azure Service Bus
azure.servicebus.queues.ecommerce.sync.queue-name=\${SERVICE_BUS_ECOMMERCE_SYNC_QUEUE_NAME}
azure.servicebus.queues.ecommerce.sync.connection-string=\${SERVICE_BUS_ECOMMERCE_SYNC_CONNECTION_STRING}
azure.servicebus.queues.ecommerce.sync-retry.queue-name=\${SERVICE_BUS_ECOMMERCE_SYNC_RETRY_QUEUE_NAME}
azure.servicebus.queues.ecommerce.sync-retry.connection-string=\${SERVICE_BUS_ECOMMERCE_SYNC_RETRY_CONNECTION_STRING}
azure.servicebus.queues.gec.sync.queue-name=\${SERVICE_BUS_GEC_SYNC_QUEUE_NAME}
azure.servicebus.queues.gec.sync.connection-string=\${SERVICE_BUS_GEC_SYNC_CONNECTION_STRING}
azure.servicebus.queues.gec.sync-retry.queue-name=\${SERVICE_BUS_GEC_SYNC_RETRY_QUEUE_NAME}
azure.servicebus.queues.gec.sync-retry.connection-string=\${SERVICE_BUS_GEC_SYNC_RETRY_CONNECTION_STRING}
azure.servicebus.queues.session.poll.queue-name=\${SERVICE_BUS_SESSION_POLL_QUEUE_NAME}
azure.servicebus.queues.session.poll.connection-string=\${SERVICE_BUS_SESSION_POLL_CONNECTION_STRING}
azure.servicebus.queues.session.expire.queue-name=\${SERVICE_BUS_SESSION_EXPIRE_QUEUE_NAME}
azure.servicebus.queues.session.expire.connection-string=\${SERVICE_BUS_SESSION_EXPIRE_CONNECTION_STRING}
azure.servicebus.topics.system.telemetry.topic-name=\${SERVICE_BUS_SYSTEM_TELEMETRY_TOPIC_NAME}
azure.servicebus.topics.system.telemetry.connection-string=\${SERVICE_BUS_SYSTEM_TELEMETRY_CONNECTION_STRING}
# Redis connection parameters
spring.data.redis.host=\${REDIS_HOST}
spring.data.redis.password=\${REDIS_PASSWORD}
spring.data.redis.port=\${REDIS_PORT}
spring.data.redis.ssl.enabled=\${REDIS_SSL_ENABLED}
spring.data.redis.timeout=\${REDIS_TIMEOUT}
spring.data.redis.connect-timeout=\${REDIS_CONNECTION_TIMEOUT}
# Redis per entity configuration
payment-session.cache.ttl-seconds=\${PAYMENT_SESSION_REDIS_TTL_SECONDS}