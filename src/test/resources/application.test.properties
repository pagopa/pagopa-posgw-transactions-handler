# Logging
logging.level.root=INFO
logging.level.it.pagopa=INFO
logging.level.web=INFO
spring.profiles.active=local

# Azure Service Bus
azure.servicebus.connection-string=Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;

azure.servicebus.queues.ecommerce.sync=posgw.cmd.ecommerce.sync
azure.servicebus.queues.ecommerce.sync-retry=posgw.cmd.ecommerce.sync.retry
azure.servicebus.queues.gec.sync=posgw.cmd.gec.sync
azure.servicebus.queues.gec.sync-retry=posgw.cmd.gec.sync.retry
azure.servicebus.queues.session.poll=posgw.cmd.session.poll
azure.servicebus.queues.session.expire=posgw.cmd.session.expire

azure.servicebus.topics.system.telemetry=posgw.evt.sys.telemetry