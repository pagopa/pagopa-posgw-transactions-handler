# Logging
logging.level.root=INFO
logging.level.it.pagopa=INFO
logging.level.web=INFO
spring.profiles.active=local

# Azure Service Bus
azure.servicebus.local.connection-string=Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
azure.servicebus.queues.ecommerce.sync.queue-name=posgw.cmd.ecommerce.sync
azure.servicebus.queues.ecommerce.sync.connection-string=\${azure.servicebus.local.connection-string}
azure.servicebus.queues.ecommerce.sync-retry.queue-name=posgw.cmd.ecommerce.sync.retry
azure.servicebus.queues.ecommerce.sync-retry.connection-string=\${azure.servicebus.local.connection-string}
azure.servicebus.queues.gec.sync.queue-name=posgw.cmd.gec.sync
azure.servicebus.queues.gec.sync.connection-string=\${azure.servicebus.local.connection-string}
azure.servicebus.queues.gec.sync-retry.queue-name=posgw.cmd.gec.sync.retry
azure.servicebus.queues.gec.sync-retry.connection-string=\${azure.servicebus.local.connection-string}
azure.servicebus.queues.session.poll.queue-name=posgw.cmd.session.poll
azure.servicebus.queues.session.poll.connection-string=\${azure.servicebus.local.connection-string}
azure.servicebus.queues.session.expire.queue-name=posgw.cmd.session.expire
azure.servicebus.queues.session.expire.connection-string=\${azure.servicebus.local.connection-string}
azure.servicebus.topics.system.telemetry.topic-name=posgw.evt.sys.telemetry
azure.servicebus.topics.system.telemetry.connection-string=\${azure.servicebus.local.connection-string}