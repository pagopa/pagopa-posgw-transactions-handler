openapi: 3.1.0
info:
  title: Pagopa Transactions Handler API
  description: APIs that will be used for pagoPA POS flow integration
  contact:
    name: pagoPA - Touchpoints team
  version: 1.0.0
servers:
  - url: https://{host}/pos-layer-service
    variables:
      host:
        description: The hostname of the API server
        default: api.platform.pagopa.it
        enum:
          - api.platform.pagopa.it
          - api.dev.platform.pagopa.it
          - api.uat.platform.pagopa.it
tags:
  - name: pagopa-pos-gateway-layer
    description: APIs exposed by pagopa POS Gateway layer
externalDocs:
  url: https://pagopa.atlassian.net/wiki/spaces/I/pages/2813689945/DR+PFM-1+-+Vista+Dinamica+delle+Componenti
  description: Design review
security:
  - PagopaApiKeyAuth: []
paths:
  /pos/sessions/{sessionId}/auth-requests:
    patch:
      tags:
        - pagopa-pos-gateway-layer
      summary: POS authorization outcome callback
      security:
        - PagopaApiKeyAuth: []
        - AuthOutcomeTokenAuth: []
      description: Notify the transaction handler about the outcome of the payment phase
      operationId: paymentAuthorizationCallback
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/SessionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationOutcomeDetails'
      responses:
        '204':
          description: Callback processed successfully
        '400':
          description: Formally invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 400
                detail: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 404
                detail: Not found
        '429':
          description: Too many requests
          headers:
            Retry-After:
              description: Indicates how long the client should wait before making a follow-up request.
              schema:
                type: string
              examples:
                http-date:
                  value: Wed, 21 Oct 2022 07:28:00 GMT
                delay-seconds:
                  value: '120'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 429
                detail: Too many requests
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 500
                detail: Internal server error
        '502':
          description: Bad gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 502
                detail: Bad gateway
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 503
                detail: Service unavailable
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 504
                detail: Gateway timeout
    post:
      tags:
        - pagopa-pos-gateway-layer
      summary: Create a POS authorization request
      security:
        - PagopaApiKeyAuth: []
      description: Starts the payment phase for an advice to be payed via POS
      operationId: ciCreatePosPayment
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Formally invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 400
                detail: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 404
                detail: Not Found
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 429
                detail: Too many requests
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 500
                detail: Internal Server Error
        '502':
          description: Bad gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 502
                detail: Bad Gateway
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 503
                detail: Service Unavailable
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 504
                detail: Gateway timeout
  /pos/sessions/{sessionId}:
    get:
      tags:
        - pagopa-pos-gateway-layer
      summary: Get POS gateway pago PA payment session info
      security:
        - PagopaApiKeyAuth: []
      description: Get POS gateway pago PA payment session info
      operationId: posGatewayGetPaymentSession
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Payment session retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusResponse'
        '400':
          description: Formally invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 400
                detail: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 404
                detail: Not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                status: 500
                detail: Internal server error
components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Subsequent API call correlation field. This should be the same for all APIs invoked in a given user session to track each call and for throubleshooting
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      description: The unique session identifier
      schema:
        $ref: '#/components/schemas/SessionId'
  schemas:
    Amount:
      minimum: 1
      type: integer
      description: Amount expressed in eurocents
      format: int64
    TerminalId:
      type: string
      description: the POS unique terminal identifier
      minLength: 8
      maxLength: 8
    SessionId:
      type: string
      description: unique identifier of the POS Gateway payment session
      format: uuid
    RRN:
      type: string
      examples:
        - '123456789012'
      description: Retrieval Reference Number -> payment unique identifier
    Bin:
      type: string
      examples:
        - '400000'
      minLength: 6
      maxLength: 8
      description: debit/credit card bin number, used to print receipts
    LastFourDigits:
      type: string
      examples:
        - '1234'
      minLength: 4
      maxLength: 4
      description: debit/credit card last four digits number, used to print receipts
    PaymentAuthCode:
      type: string
      examples:
        - '889900'
      description: payment authorization code. PSP side identifier that can be used to track back to POS authorization process
    AuthorizationOutcome:
      type: string
      enum:
        - AUTHORIZED
        - DECLINED
        - REFUSED
        - CANCELED_BY_USER
        - TIMEOUT
      examples:
        - AUTHORIZED
      description: authorization outcome
    CardBrand:
      type: string
      enum:
        - VISA
        - MASTERCARD
        - DINERS
        - AMEX
        - MAESTRO
      description: the brand of the citized debit/credit card
    AuthorizationOutcomeDetails:
      type: object
      required:
        - outcome
        - terminalId
        - timestamp
        - amount
        - details
      properties:
        outcome:
          $ref: '#/components/schemas/AuthorizationOutcome'
        terminalId:
          $ref: '#/components/schemas/TerminalId'
        timestamp:
          type: string
          format: date-time
          examples:
            - '2026-04-08T14:16:30Z'
          description: authorization timestamp
        amount:
          $ref: '#/components/schemas/Amount'
        details:
          $ref: '#/components/schemas/AuthorizationCallbackDetails'
    AuthorizationCallbackDetails:
      type: object
      oneOf:
        - $ref: '#/components/schemas/AuthorizationCallbackDetailsOk'
        - $ref: '#/components/schemas/AuthorizationCallbackDetailsKo'
    AuthorizationCallbackDetailsOk:
      type: object
      description: Authorization outcome OK details
      required:
        - paymentType
        - details
      properties:
        paymentType:
          type: string
          enum:
            - CARD
        details:
          type: object
          oneOf:
            - $ref: '#/components/schemas/AuthorizationCallbackCardDetailsOk'
      discriminator:
        propertyName: paymentType
        mapping:
          CARD: '#/components/schemas/AuthorizationCallbackCardDetailsOk'
    AuthorizationCallbackCardDetailsOk:
      type: object
      description: Authorization outcome OK details
      required:
        - bin
        - lastFourDigits
        - paymentAuthCode
        - rrn
        - brand
      properties:
        bin:
          $ref: '#/components/schemas/Bin'
        lastFourDigits:
          $ref: '#/components/schemas/LastFourDigits'
        paymentAuthCode:
          $ref: '#/components/schemas/PaymentAuthCode'
        rrn:
          $ref: '#/components/schemas/RRN'
        brand:
          $ref: '#/components/schemas/CardBrand'
    AuthorizationCallbackDetailsKo:
      type: object
      required:
        - errorDescription
      properties:
        errorDescription:
          type: string
          description: error description
    CreditorInstitutionFiscalCode:
      type: string
      maxLength: 11
      minLength: 11
      examples:
        - '80001230456'
      description: CI fiscal code
    PaymentDescription:
      minLength: 1
      maxLength: 140
      type: string
      examples:
        - Pagamento di Prova
      description: Textual description of the payment to be done
    TransferDescription:
      minLength: 1
      maxLength: 90
      type: string
      examples:
        - Pagamento di Prova
      description: |-
        Textual description of the transfer: it will be used for both the transfer description and the remittance information TXT section (automatically created by pagoPA POS gateway following EACT standard as /RFB/{iuv}/CNR/{userFiscalCode}/TXT/{TransferDescription})
    Iban:
      maxLength: 35
      minLength: 1
      pattern: ^[A-Za-z0-9]{1,35}$
      type: string
      examples:
        - IT0000000000000000000000000
      description: IBAN code
    TaxonomyCode:
      type: string
      description: collection services pagoPA taxonomy code
      pattern: (?:6|7|8|9)\/\d{7}(?:IM|TS|SP|SA|AP)\/
      maxLength: 12
      minLength: 12
    DebtorType:
      type: string
      enum:
        - G
        - F
      description: debtor type. F -> physical person, G -> legal entity
    UserFiscalCode:
      maxLength: 16
      minLength: 11
      type: string
      examples:
        - ROSMRI87A04H501K
      description: user fiscal code
    DebtorFullName:
      maxLength: 140
      minLength: 0
      type: string
      examples:
        - Mario Rossi
      description: Debtor full name, including first name, last name etc
    NoticeNumber:
      type: string
      examples:
        - '302000100000012345'
      minLength: 18
      maxLength: 18
      description: the PagoPA notice number
    IUV:
      type: string
      examples:
        - '02000100000012345'
      minLength: 17
      maxLength: 17
      description: the PagoPA `Identificativo Univoco Versamento`, the unique identifier that will track the payment and will be received in reconciliation flows
    PaymentRequest:
      type: object
      required:
        - terminalId
        - debtPositions
      properties:
        terminalId:
          $ref: '#/components/schemas/TerminalId'
        debtPositions:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DebtPosition'
    DebtPosition:
      type: object
      required:
        - type
        - details
      properties:
        type:
          type: string
          enum:
            - TO_CREATE
            - TO_CREATE_PROVIDED_IUV
            - CI_PROVIDED
          description: |-
            Defines how the debt position is managed:

            * `CI_PROVIDED`: The Creditor Institution provides the identifier of a pre-existing debt position.

            * `TO_CREATE`: The POS Gateway pagoPA creates a new debt position on the fly using the provided details and generating a new IUV.

            * `TO_CREATE_PROVIDED_IUV`: The POS Gateway pagoPA creates a new debt position on the fly using the provided details and the specific IUV supplied by the Creditor Institution.
        details:
          type: object
          oneOf:
            - $ref: '#/components/schemas/DebtPositionToCreateDetails'
            - $ref: '#/components/schemas/CiProvidedDebtPositionDetails'
            - $ref: '#/components/schemas/DebtPositionToCreateWithProvidedIuvDetails'
    DebtPositionToCreateDetails:
      type: object
      required:
        - transferList
        - debtor
        - description
      properties:
        transferList:
          type: array
          minItems: 1
          maxItems: 5
          description: list of all transfer, max 5 items
          items:
            $ref: '#/components/schemas/DebtPositionToCreateTransfer'
        debtor:
          $ref: '#/components/schemas/Debtor'
        description:
          $ref: '#/components/schemas/PaymentDescription'
    DebtPositionToCreateWithProvidedIuvDetails:
      type: object
      required:
        - transferList
        - debtor
        - description
        - iuv
      properties:
        iuv:
          $ref: '#/components/schemas/IUV'
        transferList:
          type: array
          minItems: 1
          maxItems: 5
          description: list of all transfer, max 5 items
          items:
            $ref: '#/components/schemas/DebtPositionToCreateWithProvidedIuvTransfer'
        debtor:
          $ref: '#/components/schemas/Debtor'
        description:
          $ref: '#/components/schemas/PaymentDescription'
    CiProvidedDebtPositionDetails:
      type: object
      required:
        - noticeNumber
      properties:
        noticeNumber:
          $ref: '#/components/schemas/NoticeNumber'
    DebtPositionToCreateTransfer:
      type: object
      description: information for amount transfer
      required:
        - amount
        - transferDescription
        - iban
        - category
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        transferDescription:
          $ref: '#/components/schemas/TransferDescription'
        iban:
          $ref: '#/components/schemas/Iban'
          description: the IBAN code where PSP will transfer money to after pagoPa payment transaction completion
        category:
          $ref: '#/components/schemas/TaxonomyCode'
    DebtPositionToCreateWithProvidedIuvTransfer:
      type: object
      description: information for amount transfer
      required:
        - amount
        - transferDescription
        - iban
        - category
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        transferDescription:
          $ref: '#/components/schemas/TransferDescription'
        iban:
          $ref: '#/components/schemas/Iban'
          description: the IBAN code where PSP will transfer money to after pagoPa payment transaction completion
        category:
          $ref: '#/components/schemas/TaxonomyCode'
    Debtor:
      type: object
      required:
        - type
        - fiscalCode
        - fullName
      properties:
        type:
          $ref: '#/components/schemas/DebtorType'
        fiscalCode:
          $ref: '#/components/schemas/UserFiscalCode'
        fullName:
          $ref: '#/components/schemas/DebtorFullName'
    SessionStatusResponse:
      type: object
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum:
            - SUCCESS
            - ERROR
            - ONGOING
          description: |-
            Payment session status.

            It can be one of:
            
                - ERROR -> POS payment terminated with error, payment session can be discarded
            
                - ONGOING -> POS gateway payment still in progress, wait for notification
            
                - SUCCESS -> POS gateway payment completed and notified successfully to CI layer through the ciNotifyAuthorizationOutcome operation
    PaymentResponseOutcome:
      type: string
      enum:
        - OK
        - KO
    PaymentResponse:
      type: object
      required:
        - outcome
      properties:
        outcome:
          $ref: '#/components/schemas/PaymentResponseOutcome'
      discriminator:
        propertyName: outcome
        mapping:
          OK: '#/components/schemas/OkPaymentResponse'
          KO: '#/components/schemas/KoPaymentResponse'
      oneOf:
        - $ref: '#/components/schemas/OkPaymentResponse'
        - $ref: '#/components/schemas/KoPaymentResponse'
    OkPaymentResponse:
      type: object
      required:
        - outcome
        - amount
        - details
      properties:
        outcome:
          $ref: '#/components/schemas/PaymentResponseOutcome'
        amount:
          $ref: '#/components/schemas/Amount'
        details:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/OkPaymentResponseDetails'
    KoPaymentResponse:
      type: object
      required:
        - outcome
        - amount
        - details
      properties:
        outcome:
          $ref: '#/components/schemas/PaymentResponseOutcome'
        amount:
          $ref: '#/components/schemas/Amount'
        details:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/KoPaymentResponseDetails'
    OkPaymentResponseDetails:
      type: object
      required:
        - creditorInstitutionFiscalCode
        - noticeNumber
        - iuv
        - amount
      properties:
        creditorInstitutionFiscalCode:
          $ref: '#/components/schemas/CreditorInstitutionFiscalCode'
        noticeNumber:
          $ref: '#/components/schemas/NoticeNumber'
        iuv:
          $ref: '#/components/schemas/IUV'
        amount:
          $ref: '#/components/schemas/Amount'
    KoPaymentResponseDetails:
      type: object
      required:
        - creditorInstitutionFiscalCode
        - noticeNumber
        - iuv
        - amount
        - reason
      properties:
        creditorInstitutionFiscalCode:
          $ref: '#/components/schemas/CreditorInstitutionFiscalCode'
        noticeNumber:
          $ref: '#/components/schemas/NoticeNumber'
        iuv:
          $ref: '#/components/schemas/IUV'
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          type: string
          description: Error reason
          enum:
            - CREATION_ERROR
            - ACTIVATION_ERROR
            - AUTH_ERROR
    ProblemJson:
      description: Body definition for error responses containing failure details
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |-
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          default: about:blank
          examples:
            - https://example.com/problem/constraint-violation
        title:
          type: string
          description: |-
            A short, summary of the problem type. Written in english and readable
            for engineers (usually not suited for non technical stakeholders and
            not localized); example: Service Unavailable
        status:
          $ref: '#/components/schemas/HttpStatusCode'
        detail:
          type: string
          description: |-
            A human readable explanation specific to this occurrence of the
            problem.
          examples:
            - There was an error processing the request
        instance:
          type: string
          format: uri
          description: |-
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    HttpStatusCode:
      type: integer
      format: int32
      description: |-
        The HTTP status code generated by the origin server for this occurrence
        of the problem.
      minimum: 100
      exclusiveMaximum: 600
      examples:
        - 200
  securitySchemes:
    PagopaApiKeyAuth:
      type: apiKey
      in: header
      name: Ocp-Apim-Subscription-Key
      description: pagoPA platform subscription key, generated as per `Nuova connettività specs`
    AuthOutcomeTokenAuth:
      type: http
      scheme: bearer
      description: token used to authorize outcome request, should be valued with the `outcomeAuthToken` value received in the requestPaymentAuthorization